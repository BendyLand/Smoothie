<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Smoothie 3D</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111;
      font-family: monospace;
      color: #eee;
    }
    #viewport {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid #333;
      padding: 14px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    select, input, button {
      background: #222;
      border: 1px solid #444;
      color: #eee;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: inherit;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #333;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js",
      "three/addons/": "/vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="ui">
    <div class="control-row">
      <label for="shape-select">Shape:</label>
      <select id="shape-select">
        <option value="cube">Cube</option>
        <option value="cylinder">Cylinder</option>
        <option value="cone">Cone</option>
        <option value="monkey">Monkey</option>
      </select>
    </div>

    <div class="control-row">
      <label for="bevel-width">Bevel Width:</label>
      <input type="range" id="bevel-width" min="0" max="0.5" step="0.02" value="0.2">
      <span id="bevel-width-val">0.2</span>
    </div>

    <div class="control-row">
      <label for="bevel-segments">Segments:</label>
      <input type="range" id="bevel-segments" min="1" max="8" step="1" value="4">
      <span id="bevel-segments-val">4</span>
    </div>

    <div class="control-row">
      <a href="/export/blend" download><button type="button">Download .blend</button></a>
      <a href="/export/glb" download><button type="button">Download .glb</button></a>
    </div>
  </div>

  <canvas id="viewport"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/GLTFLoader.js';

    const canvas = document.getElementById('viewport');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181818);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4, 3, 5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
    scene.add(grid);

    const loader = new GLTFLoader();
    let currentMesh = null;

    const wsUrl = `ws://${window.location.host}/ws`;
    const socket = new WebSocket(wsUrl);
    socket.binaryType = "arraybuffer";

    socket.onopen = () => {
      console.log("Connected to Smoothie engine WebSocket.");
    };

    socket.onmessage = (event) => {
      if (event.data instanceof ArrayBuffer) {
        loader.parse(event.data, '', (gltf) => {
          if (currentMesh) {
            scene.remove(currentMesh);
          }
          currentMesh = gltf.scene;

          currentMesh.traverse((child) => {
            if (child.isMesh) {
              child.material = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                roughness: 0.35,
                metalness: 0.1
              });
            }
          });

          scene.add(currentMesh);
        }, (err) => {
          console.error("GLTF parsing error:", err);
        });
      }
    };

    function sendParameters() {
      if (socket.readyState !== WebSocket.OPEN) return;
      const payload = {
        shape: document.getElementById('shape-select').value,
        bevel_width: parseFloat(document.getElementById('bevel-width').value),
        bevel_segments: parseInt(document.getElementById('bevel-segments').value, 10)
      };
      socket.send(JSON.stringify(payload));
    }

    document.getElementById('shape-select').addEventListener('change', sendParameters);

    document.getElementById('bevel-width').addEventListener('input', (e) => {
      document.getElementById('bevel-width-val').textContent = e.target.value;
      sendParameters();
    });

    document.getElementById('bevel-segments').addEventListener('input', (e) => {
      document.getElementById('bevel-segments-val').textContent = e.target.value;
      sendParameters();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
